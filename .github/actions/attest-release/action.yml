name: Attest release archive
description: Generate an SPDX SBOM plus provenance and SBOM attestations for a release archive.
inputs:
  subject-path:
    description: Archive to attest
    required: true
  scan-path:
    description: Staging directory represented by the archive
    required: true
  sbom-path:
    description: SPDX JSON output path
    required: true
runs:
  using: composite
  steps:
    - name: Generate SPDX SBOM
      id: sbom
      continue-on-error: true
      uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      with:
        path: ${{ inputs.scan-path }}
        format: spdx-json
        output-file: ${{ inputs.sbom-path }}
        upload-artifact: false

    # Retry transient tool-download failures without rerunning compilation/signing.
    # The final attempt remains a hard gate; checksums and attestations are unchanged.
    - name: Retry SPDX SBOM generation
      if: steps.sbom.outcome == 'failure'
      uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      with:
        path: ${{ inputs.scan-path }}
        format: spdx-json
        output-file: ${{ inputs.sbom-path }}
        upload-artifact: false

    - name: Include embedded native Connect dependencies
      id: native-sbom
      shell: pwsh
      run: |
        $sbom = '${{ inputs.sbom-path }}'
        ./src/Ai.Tlbx.MidTerm.ConnectNative/complete-sbom.ps1 -SbomPath $sbom
        $vex = $sbom -replace '\.spdx\.json$', '.openvex.json'
        if (Test-Path -LiteralPath $vex) { "vex=$vex" | Out-File $env:GITHUB_OUTPUT -Append }

    - name: Attest build provenance
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: ${{ inputs.subject-path }}

    - name: Attest SBOM
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: ${{ inputs.subject-path }}
        sbom-path: ${{ inputs.sbom-path }}

    - name: Attest exact upstream native backports
      if: steps.native-sbom.outputs.vex != ''
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: ${{ inputs.subject-path }}
        predicate-type: https://openvex.dev/ns/v0.2.0
        predicate-path: ${{ steps.native-sbom.outputs.vex }}
