name: Pull request verification
on:
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
concurrency:
  group: pr-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  frontend:
    name: PR frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.0'
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.402'
      - run: npm install --global npm@12.2.0 --ignore-scripts
      - run: npm ci --include=dev --no-audit --no-fund
        working-directory: src/Ai.Tlbx.MidTerm
      - run: npm run verify
        working-directory: src/Ai.Tlbx.MidTerm
  native-linux:
    name: Native Linux package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      native: ${{ steps.changes.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect native input changes
        id: changes
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA" -- \
            src/Ai.Tlbx.MidTerm.ConnectNative/ \
            src/Ai.Tlbx.MidTerm/ConnectNative.targets \
            src/Ai.Tlbx.MidTerm/Services/Connect/ConnectNativeApi.cs \
            .github/workflows/pr-verify.yml)
          if [[ -n "$changed" ]]; then
            echo 'native=true' >> "$GITHUB_OUTPUT"
          else
            echo 'native=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare and verify committed native Linux package
        if: steps.changes.outputs.native == 'true'
        shell: pwsh
        run: ./src/Ai.Tlbx.MidTerm.ConnectNative/prepare.ps1 -RuntimeIdentifier linux-x64
      - name: Verify committed native C API exports
        if: steps.changes.outputs.native == 'true'
        shell: bash
        run: |
          native_tmp=$(mktemp -d)
          trap 'rm -rf "$native_tmp"' EXIT
          cc src/Ai.Tlbx.MidTerm.ConnectNative/smoke/load.c -ldl -o "$native_tmp/load"
          python3 - "$native_tmp" <<'PY'
          import json, os, pathlib, re, shutil, subprocess, sys, zipfile
          root = pathlib.Path('src/Ai.Tlbx.MidTerm.ConnectNative')
          temporary = pathlib.Path(sys.argv[1])
          native = temporary / 'native'
          native.mkdir()
          with zipfile.ZipFile(root / 'bin/linux-x64/bundle.zip') as bundle:
              for item in bundle.infolist():
                  if item.filename != pathlib.Path(item.filename).name or item.filename in ('.', '..') or '\\' in item.filename:
                      raise ValueError('Unsafe native bundle filename')
                  with bundle.open(item) as source, (native / item.filename).open('wb') as target:
                      shutil.copyfileobj(source, target)
          manifest = json.loads((native / 'manifest.json').read_text())
          api = pathlib.Path('src/Ai.Tlbx.MidTerm/Services/Connect/ConnectNativeApi.cs').read_text()
          exports = sorted(set(re.findall(r'NativeLibrary\.GetExport\(\s*library,\s*"(rtc[A-Za-z0-9]+)"\s*\)', api)))
          if not exports:
              raise ValueError('No exact native C API export inventory found')
          env = os.environ.copy()
          env.pop('LD_LIBRARY_PATH', None)
          subprocess.run([str(temporary / 'load'), str(native / manifest['entryPoint']), *exports], check=True, timeout=30, env=env)
          PY
      - name: Audit native Linux dependencies and artifact binding
        if: steps.changes.outputs.native == 'true'
        shell: pwsh
        run: ./src/Ai.Tlbx.MidTerm.ConnectNative/audit.ps1 -RuntimeIdentifier linux-x64
  native-url-stdlib:
    name: Native URL parser (libc++)
    runs-on: macos-15-intel
    needs: native-linux
    timeout-minutes: 5
    steps:
      - name: Native input scope
        env:
          NATIVE_INPUTS: ${{ needs.native-linux.outputs.native }}
        run: echo "Native input changes=$NATIVE_INPUTS"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.native-linux.outputs.native == 'true'
        with:
          persist-credentials: false
      - name: Verify native URL parsing with libc++
        if: needs.native-linux.outputs.native == 'true'
        run: python3 src/Ai.Tlbx.MidTerm.ConnectNative/smoke/regex.py
  macos-context:
    name: macOS CLI and MCP process identity
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.402'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.0'
      - name: Build the production process identity code and protocol tests
        # Match macOS release builds: existing Unix host analyzer warnings stay visible.
        # This job gates actual macOS process behavior; broad .NET suites run locally.
        run: dotnet build src/Ai.Tlbx.MidTerm.UnitTests -c Release -p:SkipFrontendBuild=true -p:SkipConnectNativeBuild=true -p:RunAnalyzersDuringBuild=false -p:UseSharedCompilation=false
      - name: Verify macOS identity and native stdio artifact/process workflows
        run: dotnet src/Ai.Tlbx.MidTerm.UnitTests/bin/Release/net10.0/Ai.Tlbx.MidTerm.UnitTests.dll --filter-class '*MacSessionProcessContextTests' '*SessionCliContextServiceTests' '*TlbxMcpNativeProcessLifetimeTests' --report-trx --results-directory .artifacts/macos-context
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: macos-context-results
          path: .artifacts/macos-context/
          retention-days: 7
  server:
    name: PR server
    needs: [frontend, native-linux, native-url-stdlib, macos-context]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require frontend and platform checks
        shell: pwsh
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          NATIVE_RESULT: ${{ needs.native-linux.result }}
          URL_RESULT: ${{ needs.native-url-stdlib.result }}
          MACOS_CONTEXT_RESULT: ${{ needs.macos-context.result }}
        run: |
          if ($env:FRONTEND_RESULT -ne 'success' -or $env:NATIVE_RESULT -ne 'success' -or $env:URL_RESULT -ne 'success' -or $env:MACOS_CONTEXT_RESULT -ne 'success') {
            throw "PR prerequisites failed: frontend=$env:FRONTEND_RESULT; native-linux=$env:NATIVE_RESULT; URL=$env:URL_RESULT; macos-context=$env:MACOS_CONTEXT_RESULT"
          }
