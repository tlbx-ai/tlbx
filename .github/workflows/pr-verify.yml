name: Pull request verification
on:
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
concurrency:
  group: pr-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  frontend:
    name: PR frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.0'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.402'
      - run: npm install --global npm@12.2.0 --ignore-scripts
      - run: npm ci --include=dev --no-audit --no-fund
        working-directory: src/Ai.Tlbx.MidTerm
      - run: npm run verify
        working-directory: src/Ai.Tlbx.MidTerm
      - name: Package the embedded frontend used by server tests
        shell: pwsh
        run: |
          $version = (Get-Content src/version.json | ConvertFrom-Json).web
          ./src/Ai.Tlbx.MidTerm/frontend-build.ps1 -Publish -Version $version -SkipVerify -DevRelease:($version -match '-dev')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-frontend
          path: src/Ai.Tlbx.MidTerm/wwwroot/
          retention-days: 1
  server:
    name: PR server
    needs: frontend
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.402'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-frontend
          path: src/Ai.Tlbx.MidTerm/wwwroot/
      - name: Server and host contracts
        shell: pwsh
        run: ./scripts/run-dotnet-test-suite.ps1 -Configuration Release -WarnAsError
      - name: Connect transport protocol and supply-chain contracts
        shell: pwsh
        run: ./src/Ai.Tlbx.MidTerm.ConnectTransport/verify.ps1
