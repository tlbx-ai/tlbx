name: Tooling dependency verification
on:
  workflow_dispatch:
  schedule:
    - cron: '51 4 * * 1'
  push:
    branches: [dev, main]
    paths:
      - 'docs/marketing/ScreenshotAutomation/**'
      - 'src/npx-launcher/**'
      - 'scripts/audit-supply-chain.ps1'
      - '.github/workflows/tooling-verify.yml'
  pull_request:
    paths:
      - 'docs/marketing/ScreenshotAutomation/**'
      - 'src/npx-launcher/**'
      - 'scripts/audit-supply-chain.ps1'
      - '.github/workflows/tooling-verify.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.14.0'
      - name: Pin npm
        run: npm install --global npm@11.18.0 --ignore-scripts
      - name: Verify tooling dependencies and launcher
        shell: pwsh
        run: ./scripts/audit-supply-chain.ps1 -Scope tooling
