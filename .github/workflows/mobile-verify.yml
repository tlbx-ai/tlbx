name: Mobile app verification

on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 1'
  pull_request:
    paths:
      - '.github/workflows/mobile-verify.yml'
      - 'src/connectors/**'
      - 'scripts/audit-supply-chain.ps1'
      - 'scripts/get-mobile-changes.ps1'
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/mobile-verify.yml'
      - 'src/connectors/android/**'
      - 'src/connectors/ios/**'
      - 'src/connectors/shared-assets/**'
      - 'src/connectors/build-number'
      - 'scripts/audit-supply-chain.ps1'
      - 'scripts/get-mobile-changes.ps1'

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      android: ${{ steps.paths.outputs.android }}
      ios: ${{ steps.paths.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        shell: pwsh
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/get-mobile-changes.ps1
  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Audit Android dependencies
        shell: pwsh
        run: ./scripts/audit-supply-chain.ps1 -Scope android

      - name: Verify Android debug build and lint
        working-directory: src/connectors/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug lintDebug --no-daemon --console=plain

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Compile iOS app without signing
        working-directory: src/connectors/ios
        run: |
          xcodebuild build \
            -project MidTermConnector.xcodeproj \
            -scheme MidTermConnector \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
