name: Apple notarization diagnostics

on:
  workflow_dispatch:
  push:
    branches: [dev, chore/apple-notary-diagnostics]
    paths: [.github/workflows/apple-notary-diagnostics.yml]

permissions: {}

jobs:
  check-access:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - name: Check team and notarization access without uploading
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import sys

          def report(message):
              print(message, flush=True)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write(message + '\n\n')

          required = ('APPLE_ID', 'APPLE_ID_PASSWORD', 'APPLE_TEAM_ID')
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              report('Missing GitHub secrets: ' + ', '.join(missing))
              sys.exit(1)

          if os.environ['APPLE_TEAM_ID'] != 'FK7G5C74WH':
              report('FAIL: APPLE_TEAM_ID does not match the expected Johannes Schmidt team FK7G5C74WH.')
              sys.exit(1)
          report('PASS: APPLE_TEAM_ID matches team FK7G5C74WH.')

          command = [
              'xcrun', 'notarytool', 'history',
              '--apple-id', os.environ['APPLE_ID'],
              '--password', os.environ['APPLE_ID_PASSWORD'],
              '--team-id', os.environ['APPLE_TEAM_ID'],
              '--output-format', 'json',
          ]
          try:
              result = subprocess.run(command, capture_output=True, text=True, timeout=240)
          except subprocess.TimeoutExpired:
              report('FAIL: Apple notarization access check timed out after 240 seconds.')
              sys.exit(1)

          if result.returncode:
              diagnostic = (result.stderr + '\n' + result.stdout).strip()
              for name in required:
                  diagnostic = diagnostic.replace(os.environ[name], '[redacted]')
              report('FAIL: notarytool history returned exit code ' + str(result.returncode) + '.')
              report('Apple response:\n\n```text\n' + diagnostic[:4000] + '\n```')
              sys.exit(1)

          report('PASS: Apple notarization history is accessible with the CI credentials. No build or upload was performed. Submission history is not printed.')
          PY

      - name: Verify account authentication and team membership through App Store Connect
        if: always()
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          def report(message):
              print(message, flush=True)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write(message + '\n\n')

          required = ('APPLE_ID', 'APPLE_ID_PASSWORD', 'APPLE_TEAM_ID')
          if any(not os.environ.get(name) for name in required):
              report('Account membership check skipped: required Apple secrets are missing.')
              sys.exit(1)

          command = [
              'xcrun', 'altool', '--list-providers',
              '-u', os.environ['APPLE_ID'],
              '-p', '@env:APPLE_ID_PASSWORD',
              '--output-format', 'json',
          ]
          try:
              result = subprocess.run(command, capture_output=True, text=True, timeout=120)
          except subprocess.TimeoutExpired:
              report('FAIL: App Store Connect account check timed out after 120 seconds.')
              sys.exit(1)

          if result.returncode:
              diagnostic = (result.stderr + '\n' + result.stdout).strip()
              for name in required:
                  diagnostic = diagnostic.replace(os.environ[name], '[redacted]')
              report('FAIL: altool provider lookup returned exit code ' + str(result.returncode) + '.')
              report('Apple response:\n\n```text\n' + diagnostic[:4000] + '\n```')
              sys.exit(1)

          try:
              data = json.loads(result.stdout)
          except json.JSONDecodeError:
              report('FAIL: App Store Connect returned an unexpected response format; provider data was not printed.')
              sys.exit(1)

          providers = data.get('providers')
          if not isinstance(providers, list):
              report('FAIL: No provider list in the App Store Connect response. Top-level fields: ' + ', '.join(sorted(data)))
              sys.exit(1)

          report('PASS: App Store Connect accepted the CI Apple ID and app-specific password.')
          matches = [provider for provider in providers if provider.get('WWDRTeamID') == os.environ['APPLE_TEAM_ID']]
          if not matches:
              report('FAIL: The CI Apple account does not list the configured team among its App Store Connect providers. Provider count: ' + str(len(providers)) + '.')
              sys.exit(1)
          report('PASS: App Store Connect confirms the CI account belongs to the configured team. Provider count: ' + str(len(providers)) + '. Provider identifiers and account details were not printed.')
          PY

      - name: Check whether App Store Connect application access is also blocked
        if: always()
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          try:
              result = subprocess.run([
                  'xcrun', 'altool', '--list-apps', '-u', os.environ['APPLE_ID'],
                  '-p', '@env:APPLE_ID_PASSWORD', '--output-format', 'json',
              ], capture_output=True, text=True, timeout=120)
          except subprocess.TimeoutExpired:
              message = 'FAIL: App Store Connect application access timed out after 120 seconds.'
          else:
              if not result.returncode:
                  message = 'PASS: App Store Connect application listing is accessible. Application data was not printed.'
              else:
                  try:
                      data = json.loads(result.stdout)
                      errors = json.dumps(data.get('product-errors', data.get('errors', [])))
                  except json.JSONDecodeError:
                      errors = '(No structured error response.)'
                  detail = result.stderr + '\n' + errors
                  for name in ('APPLE_ID', 'APPLE_ID_PASSWORD'):
                      detail = detail.replace(os.environ.get(name, ''), '[redacted]') if os.environ.get(name) else detail
                  message = 'FAIL: App Store Connect application listing returned exit code ' + str(result.returncode) + '.\n\n```text\n' + detail[:4000] + '\n```'
          print(message)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(message + '\n\n')
          sys.exit(0 if message.startswith('PASS:') else 1)
          PY
