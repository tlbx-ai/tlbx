name: Build system verification
on:
  workflow_dispatch:
  push:
    branches: [dev, main]
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
      - 'global.json'
      - 'src/Ai.Tlbx.MidTerm.AgentHost/Ai.Tlbx.MidTerm.AgentHost.csproj'
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  verify:
    name: Release workflow (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify test selection and runtime reuse contracts
        shell: pwsh
        run: |
          ./scripts/test-release-build-system.ps1
          ./scripts/test-release-pr.ps1
          python ./scripts/test-release-publication.py
          if ($LASTEXITCODE -ne 0) { throw 'Release publication tests failed.' }

  dotnet-sdks:
    name: .NET 10 + 11 (${{ matrix.rid }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            rid: win-x64
            architecture: x64
          - os: windows-2022
            rid: win-x86
            architecture: x86
          - os: ubuntu-24.04
            rid: linux-x64
            architecture: x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            architecture: arm64
          - os: macos-15-intel
            rid: osx-x64
            architecture: x64
          - os: macos-15
            rid: osx-arm64
            architecture: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.402
            11.0.100
          architecture: ${{ matrix.architecture }}
      - name: Compile and execute with both SDKs and runtimes
        shell: pwsh
        run: ./scripts/verify-dotnet-sdks.ps1 -Architecture '${{ matrix.architecture }}'
