name: Build system verification
on:
  workflow_dispatch:
  push:
    branches: [dev, main]
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
      - 'src/Ai.Tlbx.MidTerm.AgentHost/Ai.Tlbx.MidTerm.AgentHost.csproj'
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
      - 'src/Ai.Tlbx.MidTerm.AgentHost/Ai.Tlbx.MidTerm.AgentHost.csproj'
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify test selection and runtime reuse contracts
        shell: pwsh
        run: ./scripts/test-release-build-system.ps1
