name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'On-demand package (no release publication)'
        type: choice
        required: true
        default: win-x64
        options:
          - win-x64
          - osx-x64

env:
  DOTNET_VERSION: '11.0.100'
  DOTNET_VERSIONS: |
    10.0.402
    11.0.100
  NPM_VERSION: '12.2.0'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  GIT_CONFIG_COUNT: '2'
  GIT_CONFIG_KEY_0: 'advice.detachedHead'
  GIT_CONFIG_VALUE_0: 'false'
  GIT_CONFIG_KEY_1: 'init.defaultBranch'
  GIT_CONFIG_VALUE_1: 'main'

jobs:

  # ── Keep releases draft until shared checks and available packages pass ──
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    outputs:
      is_dev: ${{ github.event_name == 'workflow_dispatch' || contains(github.ref_name, '-dev') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false

      - name: Verify tag belongs to a merged release PR
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/verify-release-merge.ps1 -Tag $env:RELEASE_TAG

      - name: Fetch tag annotation
        if: github.event_name == 'push'
        run: git fetch origin tag ${{ github.ref_name }} --no-tags --force

      - name: Create release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE=$(git tag -l --format='%(contents:subject)' ${{ github.ref_name }})
          NOTES=$(git tag -l --format='%(contents:body)' ${{ github.ref_name }})
          IS_DEV=false
          RELEASE_STATE=(--draft)
          if [[ "${{ github.ref_name }}" == *"-dev"* ]]; then
            IS_DEV=true
            RELEASE_STATE=(--draft --prerelease)
          fi
          MAX_RELEASE_BODY=124000
          RELEASE_TAG="${{ github.ref_name }}"
          export NOTES MAX_RELEASE_BODY RELEASE_TAG
          RELEASE_NOTES=$(python3 - <<'PY'
          import os
          import re
          import sys

          max_len = int(os.environ["MAX_RELEASE_BODY"])
          prefix = "## What's Changed\n"
          notes = os.environ.get("NOTES", "").rstrip("\n")
          release_tag = os.environ["RELEASE_TAG"]
          integrity = (
              "## Release integrity\n\n"
              "Native archives have matching platform-specific SPDX SBOM assets plus GitHub build-provenance and SBOM attestations. "
              "Installers and the built-in updater additionally verify a signed manifest and all packaged-file hashes.\n\n"
              f"[Verification guide](https://github.com/tlbx-ai/tlbx/blob/{release_tag}/docs/RELEASE-INTEGRITY.md) · "
              f"[Security policy](https://github.com/tlbx-ai/tlbx/blob/{release_tag}/SECURITY.md)"
          )
          notes = f"{notes}\n\n{integrity}" if notes else integrity

          full = prefix + notes
          if len(full) <= max_len:
              sys.stdout.write(full)
              raise SystemExit

          paragraphs = [part for part in re.split(r"\n{2,}", notes) if part]
          grouped_notice = "[Older release notes omitted to stay within GitHub's release size limit: {count} older sections omitted.]\n\n"

          if len(paragraphs) > 1:
              kept = []
              for idx in range(len(paragraphs) - 1, -1, -1):
                  candidate = [paragraphs[idx]] + kept
                  omitted = len(paragraphs) - len(candidate)
                  notice = grouped_notice.format(count=omitted) if omitted else ""
                  candidate_text = prefix + notice + "\n\n".join(candidate)
                  if len(candidate_text) <= max_len:
                      kept = candidate
                  elif kept:
                      break
                  else:
                      raise SystemExit("Latest release-note section exceeds the GitHub release body limit by itself.")

              omitted = len(paragraphs) - len(kept)
              notice = grouped_notice.format(count=omitted) if omitted else ""
              sys.stdout.write(prefix + notice + "\n\n".join(kept))
              raise SystemExit

          fallback_notice = "[Release notes truncated to stay within GitHub's release size limit.]\n\n"
          budget = max_len - len(prefix) - len(fallback_notice)
          if budget <= 0:
              raise SystemExit("Configured GitHub release body limit is too small.")

          sys.stdout.write(prefix + fallback_notice + notes[-budget:])
          PY
          )
          RELEASE_NOTES_FILE=$(mktemp)
          trap 'rm -f "$RELEASE_NOTES_FILE"' EXIT
          printf '%s' "$RELEASE_NOTES" > "$RELEASE_NOTES_FILE"
          if gh release view ${{ github.ref_name }} >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view ${{ github.ref_name }} --json isDraft --jq '.isDraft')
            if [[ "$IS_DRAFT" != "true" ]]; then
              echo "::error::Release ${{ github.ref_name }} is already published; refusing to move it back to draft."
              exit 1
            fi
            gh release edit ${{ github.ref_name }} \
              "${RELEASE_STATE[@]}" \
              --title "$TITLE" \
              --notes-file "$RELEASE_NOTES_FILE"
          else
            gh release create ${{ github.ref_name }} \
              "${RELEASE_STATE[@]}" \
              --title "$TITLE" \
              --notes-file "$RELEASE_NOTES_FILE"
          fi

  supply-chain:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSIONS }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.0'

      - name: Pin npm with strict lifecycle allowlisting support
        run: npm install --global "npm@$NPM_VERSION" --ignore-scripts

      - name: Audit shipped server dependencies
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/audit-supply-chain.ps1 -Scope server

  # ── Build frontend once (platform-agnostic JS/CSS/HTML) ──────────────────
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSIONS }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.0'

      - name: Pin npm with strict lifecycle allowlisting support
        run: npm install --global "npm@$NPM_VERSION" --ignore-scripts

      - name: Install npm packages
        working-directory: src/Ai.Tlbx.MidTerm
        run: npm ci --include=dev --prefer-offline --no-audit --no-fund

      - name: Lint and typecheck frontend
        working-directory: src/Ai.Tlbx.MidTerm
        run: npm run typecheck && npm run lint

      - name: Build frontend
        shell: pwsh
        run: |
          $version = (Get-Content src/version.json | ConvertFrom-Json).web
          $isDev = $version.Contains('-dev')
          $buildArgs = @{ Publish = $true; Version = $version; SkipVerify = $true }
          if ($isDev) { $buildArgs.DevRelease = $true }
          ./src/Ai.Tlbx.MidTerm/frontend-build.ps1 @buildArgs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend
          path: src/Ai.Tlbx.MidTerm/wwwroot/
          retention-days: 1

  build-dev:
    needs: [prepare, frontend, supply-chain]
    if: >-
      (github.event_name == 'push' && needs.prepare.outputs.is_dev == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.platform == 'osx-x64')
    # A platform failure must not invalidate other complete, verified packages.
    # publish-release remains the required final gate, including shared checks.
    continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '[{"os":"macos-15-intel","rid":"osx-x64","ext":""}]' || '[{"os":"macos-15","rid":"osx-arm64","ext":""},{"os":"ubuntu-24.04","rid":"linux-x64","ext":""},{"os":"ubuntu-24.04-arm","rid":"linux-arm64","ext":""}]') }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSIONS }}

      - name: Download frontend
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend
          path: src/Ai.Tlbx.MidTerm/wwwroot/

      - name: Import Apple Developer ID certificate
        if: startsWith(matrix.rid, 'osx-')
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_P12_PASSWORD" \
            -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Build server and reuse verified unchanged hosts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-runtime-set.ps1 -Rid '${{ matrix.rid }}' -Configuration Release

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p staging/${{ matrix.rid }}
          cp src/Ai.Tlbx.MidTerm/bin/Release/net11.0/${{ matrix.rid }}/publish/mt${{ matrix.ext }} staging/${{ matrix.rid }}/
          cp src/version.json staging/${{ matrix.rid }}/
          cp .artifacts/runtime-inputs/${{ matrix.rid }}/runtime-inputs.json staging/${{ matrix.rid }}/
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            cp src/Ai.Tlbx.MidTerm.TmuxShim/bin/Release/net11.0/${{ matrix.rid }}/publish/mttmux.exe staging/${{ matrix.rid }}/
          fi
          mthost_tfm="net11.0"
          [[ "${{ matrix.rid }}" == win-* ]] && mthost_tfm="net11.0-windows10.0.19041.0"
          if [[ -f src/Ai.Tlbx.MidTerm.TtyHost/bin/Release/${mthost_tfm}/${{ matrix.rid }}/publish/mthost${{ matrix.ext }} ]]; then
            cp src/Ai.Tlbx.MidTerm.TtyHost/bin/Release/${mthost_tfm}/${{ matrix.rid }}/publish/mthost${{ matrix.ext }} staging/${{ matrix.rid }}/
          else
            echo "mthost${{ matrix.ext }} not found for ${{ matrix.rid }}; continuing with web-only artifact set"
          fi
          cp src/Ai.Tlbx.MidTerm.AgentHost/bin/Release/net11.0/${{ matrix.rid }}/publish/mtagenthost${{ matrix.ext }} staging/${{ matrix.rid }}/

          if [[ "${{ matrix.rid }}" == osx-* ]]; then
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            codesign --force \
              --sign "Developer ID Application: Johannes Schmidt (FK7G5C74WH)" \
              --options runtime \
              --timestamp \
              staging/${{ matrix.rid }}/mt
            codesign --verify --strict staging/${{ matrix.rid }}/mt
            if [[ "${TLBX_HOSTS_REUSED:-false}" != "true" && -f staging/${{ matrix.rid }}/mthost ]]; then
              codesign --force \
                --sign "Developer ID Application: Johannes Schmidt (FK7G5C74WH)" \
                --options runtime \
                --timestamp \
                staging/${{ matrix.rid }}/mthost
              codesign --verify --strict staging/${{ matrix.rid }}/mthost
            fi
            if [[ "${TLBX_HOSTS_REUSED:-false}" != "true" ]]; then
              codesign --force \
                --sign "Developer ID Application: Johannes Schmidt (FK7G5C74WH)" \
                --options runtime \
                --timestamp \
                staging/${{ matrix.rid }}/mtagenthost
            fi
            codesign --verify --strict staging/${{ matrix.rid }}/mtagenthost
          fi

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd staging/${{ matrix.rid }}
          files=(mt${{ matrix.ext }} mtagenthost${{ matrix.ext }})
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            files+=(mttmux.exe)
          fi
          if [[ -f mthost${{ matrix.ext }} ]]; then
            files+=(mthost${{ matrix.ext }})
          fi
          if command -v sha256sum &> /dev/null; then
            sha256sum "${files[@]}" > SHA256SUMS.txt
          else
            shasum -a 256 "${files[@]}" > SHA256SUMS.txt
          fi
          echo "=== ${{ matrix.rid }} ==="
          cat SHA256SUMS.txt

      - name: Notarize
        if: startsWith(matrix.rid, 'osx-')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          files=(staging/${{ matrix.rid }}/mt staging/${{ matrix.rid }}/mtagenthost)
          if [[ -f staging/${{ matrix.rid }}/mthost ]]; then
            files+=(staging/${{ matrix.rid }}/mthost)
          fi
          zip -j "$RUNNER_TEMP/notarize.zip" "${files[@]}"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      - name: Sign version.json
        shell: pwsh
        env:
          SIGNING_PRIVATE_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
        run: ./scripts/sign-release.ps1 -ArtifactsPath staging

      - name: Package release
        shell: pwsh
        run: |
          $rid = "${{ matrix.rid }}"
          $archive = "staging/mt-$rid.tar.gz"
          tar -cf - -C "staging/$rid" . | gzip -9 > $archive

      - name: Generate SBOM and attest release
        uses: ./.github/actions/attest-release
        with:
          subject-path: staging/mt-${{ matrix.rid }}.tar.gz
          scan-path: staging/${{ matrix.rid }}
          sbom-path: staging/mt-${{ matrix.rid }}.spdx.json

      - name: Upload release archive and SBOM
        if: github.event_name == 'push'
        id: release_upload
        timeout-minutes: 3
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./scripts/upload-release-assets.ps1
          -Tag "${{ github.ref_name }}"
          -ArchivePath "staging/mt-${{ matrix.rid }}.tar.gz"
          -SbomPath "staging/mt-${{ matrix.rid }}.spdx.json"

      - name: Preserve signed package after upload failure
        if: failure() && steps.release_upload.outcome == 'failure'
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-upload-${{ matrix.rid }}-${{ github.run_attempt }}
          path: |
            staging/mt-${{ matrix.rid }}.tar.gz
            staging/mt-${{ matrix.rid }}.spdx.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Retain on-demand macOS Intel package
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-package-${{ matrix.rid }}
          path: |
            staging/mt-${{ matrix.rid }}.tar.gz
            staging/mt-${{ matrix.rid }}.spdx.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Clean up keychain
        if: startsWith(matrix.rid, 'osx-') && always()
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" && -e "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

  # ── Build macOS + Linux for stable/public releases ─────────────────────────
  build:
    needs: [prepare, frontend, supply-chain]
    if: needs.prepare.outputs.is_dev != 'true'
    continue-on-error: true
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            rid: osx-arm64
            ext: ''
          - os: ubuntu-24.04
            rid: linux-x64
            ext: ''
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            ext: ''
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSIONS }}

      - name: Download frontend
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend
          path: src/Ai.Tlbx.MidTerm/wwwroot/

      - name: Import Apple Developer ID certificate
        if: startsWith(matrix.rid, 'osx-')
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_P12_PASSWORD" \
            -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Build server and reuse verified unchanged hosts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-runtime-set.ps1 -Rid '${{ matrix.rid }}' -Configuration Release

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p staging/${{ matrix.rid }}
          cp src/Ai.Tlbx.MidTerm/bin/Release/net11.0/${{ matrix.rid }}/publish/mt${{ matrix.ext }} staging/${{ matrix.rid }}/
          cp src/version.json staging/${{ matrix.rid }}/
          cp .artifacts/runtime-inputs/${{ matrix.rid }}/runtime-inputs.json staging/${{ matrix.rid }}/
          mthost_tfm="net11.0"
          [[ "${{ matrix.rid }}" == win-* ]] && mthost_tfm="net11.0-windows10.0.19041.0"
          if [[ -f src/Ai.Tlbx.MidTerm.TtyHost/bin/Release/${mthost_tfm}/${{ matrix.rid }}/publish/mthost${{ matrix.ext }} ]]; then
            cp src/Ai.Tlbx.MidTerm.TtyHost/bin/Release/${mthost_tfm}/${{ matrix.rid }}/publish/mthost${{ matrix.ext }} staging/${{ matrix.rid }}/
          else
            echo "mthost${{ matrix.ext }} not found for ${{ matrix.rid }}; continuing with web-only artifact set"
          fi
          cp src/Ai.Tlbx.MidTerm.AgentHost/bin/Release/net11.0/${{ matrix.rid }}/publish/mtagenthost${{ matrix.ext }} staging/${{ matrix.rid }}/

          if [[ "${{ matrix.rid }}" == osx-* ]]; then
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            codesign --force \
              --sign "Developer ID Application: Johannes Schmidt (FK7G5C74WH)" \
              --options runtime \
              --timestamp \
              staging/${{ matrix.rid }}/mt
            codesign --verify --strict staging/${{ matrix.rid }}/mt
            if [[ "${TLBX_HOSTS_REUSED:-false}" != "true" && -f staging/${{ matrix.rid }}/mthost ]]; then
              codesign --force \
                --sign "Developer ID Application: Johannes Schmidt (FK7G5C74WH)" \
                --options runtime \
                --timestamp \
                staging/${{ matrix.rid }}/mthost
              codesign --verify --strict staging/${{ matrix.rid }}/mthost
            fi
            if [[ "${TLBX_HOSTS_REUSED:-false}" != "true" ]]; then
              codesign --force \
                --sign "Developer ID Application: Johannes Schmidt (FK7G5C74WH)" \
                --options runtime \
                --timestamp \
                staging/${{ matrix.rid }}/mtagenthost
            fi
            codesign --verify --strict staging/${{ matrix.rid }}/mtagenthost
          fi

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd staging/${{ matrix.rid }}
          files=(mt${{ matrix.ext }} mtagenthost${{ matrix.ext }})
          if [[ -f mthost${{ matrix.ext }} ]]; then
            files+=(mthost${{ matrix.ext }})
          fi
          if command -v sha256sum &> /dev/null; then
            sha256sum "${files[@]}" > SHA256SUMS.txt
          else
            shasum -a 256 "${files[@]}" > SHA256SUMS.txt
          fi
          echo "=== ${{ matrix.rid }} ==="
          cat SHA256SUMS.txt

      - name: Notarize
        if: startsWith(matrix.rid, 'osx-')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          files=(staging/${{ matrix.rid }}/mt staging/${{ matrix.rid }}/mtagenthost)
          if [[ -f staging/${{ matrix.rid }}/mthost ]]; then
            files+=(staging/${{ matrix.rid }}/mthost)
          fi
          zip -j "$RUNNER_TEMP/notarize.zip" "${files[@]}"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      - name: Sign version.json
        shell: pwsh
        env:
          SIGNING_PRIVATE_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
        run: ./scripts/sign-release.ps1 -ArtifactsPath staging

      - name: Package release
        shell: pwsh
        run: |
          $rid = "${{ matrix.rid }}"
          $archive = "staging/mt-$rid.tar.gz"
          tar -cf - -C "staging/$rid" . | gzip -9 > $archive

      - name: Generate SBOM and attest release
        uses: ./.github/actions/attest-release
        with:
          subject-path: staging/mt-${{ matrix.rid }}.tar.gz
          scan-path: staging/${{ matrix.rid }}
          sbom-path: staging/mt-${{ matrix.rid }}.spdx.json

      - name: Upload release archive and SBOM
        id: release_upload
        timeout-minutes: 3
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./scripts/upload-release-assets.ps1
          -Tag "${{ github.ref_name }}"
          -ArchivePath "staging/mt-${{ matrix.rid }}.tar.gz"
          -SbomPath "staging/mt-${{ matrix.rid }}.spdx.json"

      - name: Preserve signed package after upload failure
        if: failure() && steps.release_upload.outcome == 'failure'
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-upload-${{ matrix.rid }}-${{ github.run_attempt }}
          path: |
            staging/mt-${{ matrix.rid }}.tar.gz
            staging/mt-${{ matrix.rid }}.spdx.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Clean up keychain
        if: startsWith(matrix.rid, 'osx-') && always()
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" && -e "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

  # ── Build Windows: hosted runner for dev, self-hosted with signing for stable ─
  build-windows-dev:
    needs: [prepare, frontend, supply-chain]
    if: needs.prepare.outputs.is_dev == 'true' && (github.event_name != 'workflow_dispatch' || inputs.platform != 'osx-x64')
    continue-on-error: true
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '[{"rid":"win-x64"}]' || '[{"rid":"win-x64"},{"rid":"win-x86"}]') }}
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download frontend
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend
          path: src/Ai.Tlbx.MidTerm/wwwroot/

      - name: Build server and reuse verified unchanged hosts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-runtime-set.ps1 -Rid '${{ matrix.rid }}' -Configuration Release -RebuildHosts:($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch')

      - name: Stage artifacts
        shell: pwsh
        run: |
          $rid = '${{ matrix.rid }}'
          New-Item -ItemType Directory -Force "staging/$rid" | Out-Null
          Copy-Item "src/Ai.Tlbx.MidTerm/bin/Release/net11.0/$rid/publish/mt.exe" "staging/$rid/"
          Copy-Item "src/Ai.Tlbx.MidTerm.TmuxShim/bin/Release/net11.0/$rid/publish/mttmux.exe" "staging/$rid/"
          Copy-Item src/version.json "staging/$rid/"
          Copy-Item ".artifacts/runtime-inputs/$rid/runtime-inputs.json" "staging/$rid/"
          Copy-Item "src/Ai.Tlbx.MidTerm/src/static/THIRD-PARTY-LICENSES.txt" "staging/$rid/"
          $mthostPath = "src/Ai.Tlbx.MidTerm.TtyHost/bin/Release/net11.0-windows10.0.19041.0/$rid/publish/mthost.exe"
          if (Test-Path $mthostPath) {
            Copy-Item $mthostPath "staging/$rid/"
            ./scripts/copy-windows-conpty-runtime.ps1 `
              -SourceDir (Split-Path -Parent $mthostPath) `
              -DestinationDir "staging/$rid" `
              -Rid $rid
          } else {
            Write-Host "mthost.exe not found for $rid; continuing with web-only artifact set"
          }
          Copy-Item "src/Ai.Tlbx.MidTerm.AgentHost/bin/Release/net11.0/$rid/publish/mtagenthost.exe" "staging/$rid/"

      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          $rid = '${{ matrix.rid }}'
          $root = (Resolve-Path "staging/$rid").Path
          $files = Get-ChildItem $root -Recurse -File | Where-Object Name -NotIn @("version.json", "SHA256SUMS.txt")
          $hashes = $files | ForEach-Object {
            $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower()
            $relativePath = [IO.Path]::GetRelativePath($root, $_.FullName).Replace('\', '/')
            "$hash  $relativePath"
          }
          $hashes | Set-Content "staging/$rid/SHA256SUMS.txt"
          Write-Host "=== $rid ==="
          Get-Content "staging/$rid/SHA256SUMS.txt"

      - name: Sign version.json
        shell: pwsh
        env:
          SIGNING_PRIVATE_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
        run: ./scripts/sign-release.ps1 -ArtifactsPath staging

      - name: Package release
        shell: pwsh
        run: |
          $rid = '${{ matrix.rid }}'
          $archive = "staging/mt-$rid.zip"
          if (Get-Command 7z -ErrorAction SilentlyContinue) {
            7z a -tzip -mx=1 $archive "./staging/$rid/*" | Out-Null
          } else {
            Compress-Archive -Path "./staging/$rid/*" -DestinationPath $archive -CompressionLevel Fastest -Force
          }

      - name: Generate SBOM and attest release
        uses: ./.github/actions/attest-release
        with:
          subject-path: staging/mt-${{ matrix.rid }}.zip
          scan-path: staging/${{ matrix.rid }}
          sbom-path: staging/mt-${{ matrix.rid }}.spdx.json

      - name: Upload release archive and SBOM
        if: github.event_name == 'push'
        id: release_upload
        timeout-minutes: 3
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./scripts/upload-release-assets.ps1
          -Tag "${{ github.ref_name }}"
          -ArchivePath "staging/mt-${{ matrix.rid }}.zip"
          -SbomPath "staging/mt-${{ matrix.rid }}.spdx.json"

      - name: Preserve signed package after upload failure
        if: failure() && steps.release_upload.outcome == 'failure'
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-upload-${{ matrix.rid }}-${{ github.run_attempt }}
          path: |
            staging/mt-${{ matrix.rid }}.zip
            staging/mt-${{ matrix.rid }}.spdx.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Retain measured package and publish diagnostics
        if: github.event_name == 'workflow_dispatch' || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-package-${{ matrix.rid }}
          path: |
            staging/mt-${{ matrix.rid }}.zip
            staging/mt-${{ matrix.rid }}.spdx.json
            .artifacts/runtime-publish/${{ matrix.rid }}/
          compression-level: 0
          retention-days: 3
  build-windows:
    needs: [prepare, frontend, supply-chain]
    if: needs.prepare.outputs.is_dev != 'true'
    continue-on-error: true
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        rid: [win-x64, win-x86]
    runs-on: [self-hosted, windows, signing]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned .NET SDK on self-hosted Windows runner
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet-sdk
        with:
          dotnet-version: ${{ env.DOTNET_VERSIONS }}

      - name: Verify selected .NET SDK
        shell: pwsh
        run: |
          $selectedSdk = dotnet --version
          if ($LASTEXITCODE -ne 0 -or $selectedSdk -ne $env:DOTNET_VERSION) {
            throw "Required .NET SDK $env:DOTNET_VERSION was not selected (actual: $selectedSdk)."
          }
          Write-Host "Using .NET SDK $selectedSdk"

      - name: Download frontend
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend
          path: src/Ai.Tlbx.MidTerm/wwwroot/

      - name: Build server and reuse verified unchanged hosts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-runtime-set.ps1 -Rid '${{ matrix.rid }}' -Configuration Release

      - name: Stage artifacts
        shell: pwsh
        run: |
          $rid = '${{ matrix.rid }}'
          New-Item -ItemType Directory -Force "staging/$rid" | Out-Null
          Copy-Item "src/Ai.Tlbx.MidTerm/bin/Release/net11.0/$rid/publish/mt.exe" "staging/$rid/"
          Copy-Item "src/Ai.Tlbx.MidTerm.TmuxShim/bin/Release/net11.0/$rid/publish/mttmux.exe" "staging/$rid/"
          Copy-Item src/version.json "staging/$rid/"
          Copy-Item ".artifacts/runtime-inputs/$rid/runtime-inputs.json" "staging/$rid/"
          Copy-Item "src/Ai.Tlbx.MidTerm/src/static/THIRD-PARTY-LICENSES.txt" "staging/$rid/"
          $mthostPath = "src/Ai.Tlbx.MidTerm.TtyHost/bin/Release/net11.0-windows10.0.19041.0/$rid/publish/mthost.exe"
          if (Test-Path $mthostPath) {
            Copy-Item $mthostPath "staging/$rid/"
            ./scripts/copy-windows-conpty-runtime.ps1 `
              -SourceDir (Split-Path -Parent $mthostPath) `
              -DestinationDir "staging/$rid" `
              -Rid $rid
          } else {
            Write-Host "mthost.exe not found for $rid; continuing with web-only artifact set"
          }
          Copy-Item "src/Ai.Tlbx.MidTerm.AgentHost/bin/Release/net11.0/$rid/publish/mtagenthost.exe" "staging/$rid/"

      - name: Require stable Windows signing inputs
        shell: pwsh
        run: |
          $rid = '${{ matrix.rid }}'
          if (-not (Test-Path "staging/$rid/mt.exe")) {
            throw 'mt.exe must be present before stable Windows signing.'
          }
          if (-not (Test-Path "staging/$rid/mtagenthost.exe")) {
            throw 'mtagenthost.exe must be present before stable Windows signing.'
          }
          if (-not (Test-Path "staging/$rid/mttmux.exe")) {
            throw 'mttmux.exe must be present before stable Windows signing.'
          }

      - name: Sign Windows binaries (mt.exe, mthost.exe, mtagenthost.exe, mttmux.exe)
        shell: pwsh
        run: ./scripts/sign-windows-binaries.ps1 -StagingPath 'staging/${{ matrix.rid }}'

      - name: Verify stable Windows Authenticode signatures
        shell: pwsh
        run: |
          $rid = '${{ matrix.rid }}'
          $files = @("staging/$rid/mt.exe", "staging/$rid/mtagenthost.exe", "staging/$rid/mttmux.exe")
          if (Test-Path "staging/$rid/mthost.exe") {
            $files += "staging/$rid/mthost.exe"
          }

          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file
            if ($signature.Status -ne 'Valid') {
              throw "Authenticode verification failed for ${file}: $($signature.StatusMessage)"
            }
          }

      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          $rid = '${{ matrix.rid }}'
          $root = (Resolve-Path "staging/$rid").Path
          $files = Get-ChildItem $root -Recurse -File | Where-Object Name -NotIn @("version.json", "SHA256SUMS.txt")
          $hashes = $files | ForEach-Object {
            $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower()
            $relativePath = [IO.Path]::GetRelativePath($root, $_.FullName).Replace('\', '/')
            "$hash  $relativePath"
          }
          $hashes | Set-Content "staging/$rid/SHA256SUMS.txt"
          Write-Host "=== $rid ==="
          Get-Content "staging/$rid/SHA256SUMS.txt"

      - name: Sign version.json
        shell: pwsh
        env:
          SIGNING_PRIVATE_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
        run: ./scripts/sign-release.ps1 -ArtifactsPath staging

      - name: Package release
        shell: pwsh
        run: |
          $rid = '${{ matrix.rid }}'
          $archive = "staging/mt-$rid.zip"
          if (Get-Command 7z -ErrorAction SilentlyContinue) {
            7z a -tzip -mx=1 $archive "./staging/$rid/*" | Out-Null
          } else {
            Compress-Archive -Path "./staging/$rid/*" -DestinationPath $archive -CompressionLevel Fastest -Force
          }

      - name: Generate SBOM and attest release
        uses: ./.github/actions/attest-release
        with:
          subject-path: staging/mt-${{ matrix.rid }}.zip
          scan-path: staging/${{ matrix.rid }}
          sbom-path: staging/mt-${{ matrix.rid }}.spdx.json

      - name: Upload release archive and SBOM
        id: release_upload
        timeout-minutes: 3
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./scripts/upload-release-assets.ps1
          -Tag "${{ github.ref_name }}"
          -ArchivePath "staging/mt-${{ matrix.rid }}.zip"
          -SbomPath "staging/mt-${{ matrix.rid }}.spdx.json"

      - name: Preserve signed package after upload failure
        if: failure() && steps.release_upload.outcome == 'failure'
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-upload-${{ matrix.rid }}-${{ github.run_attempt }}
          path: |
            staging/mt-${{ matrix.rid }}.zip
            staging/mt-${{ matrix.rid }}.spdx.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish-npm:
    needs: [prepare, publish-release]
    if: needs.prepare.outputs.is_dev != 'true'
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing
        run: |
          npm install --global "npm@$NPM_VERSION" --ignore-scripts
          node --version
          npm --version

      - name: Sync launcher version
        run: node ./scripts/sync-npx-launcher-version.mjs

      - name: Publish npm launcher
        shell: bash
        working-directory: src/npx-launcher
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@tlbx-ai/midterm@$VERSION" version >/dev/null 2>&1; then
            echo "@tlbx-ai/midterm@$VERSION is already published, skipping"
            exit 0
          fi
          npm publish --access public --provenance --tag latest

  publish-release:
    needs: [prepare, frontend, supply-chain, build, build-windows, build-dev, build-windows-dev]
    if: >-
      always() && !cancelled() && needs.prepare.result == 'success' &&
      needs.frontend.result == 'success' && needs.supply-chain.result == 'success' &&
      github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate and publish available platforms
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          RELEASE_JSON=$(mktemp)
          RELEASE_PATCH=$(mktemp)
          trap 'rm -f "$RELEASE_JSON" "$RELEASE_PATCH"' EXIT
          gh release view "$RELEASE_TAG" \
            --repo "$REPOSITORY" \
            --json databaseId,tagName,isDraft,isPrerelease,assets,body \
            > "$RELEASE_JSON"

          RELEASE_ID=$(python3 scripts/validate-release-publication.py "$RELEASE_JSON" "$RELEASE_TAG" "$RELEASE_PATCH")
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          gh api \
            --method PATCH \
            "repos/$REPOSITORY/releases/$RELEASE_ID" \
            --input "$RELEASE_PATCH" \
            > /dev/null

  publish-builds:
    needs: publish-release
    if: ${{ !cancelled() && needs.publish-release.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: https-build-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish verified public packages over HTTPS
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/publish-builds.ps1 -Tag $env:RELEASE_TAG

  prune-artifacts:
    needs: [prepare, publish-release]
    if: needs.prepare.outputs.is_dev != 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prune old workflow artifacts outside retained release lines
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/prune-release-artifacts.ps1 `
            -Repository "${{ github.repository }}" `
            -CurrentTag "${{ github.ref_name }}"
